name: Deploy GitHub Pages

# DO NOT re-add a `push:` trigger to this workflow.
#
# This repo publishes ONE GitHub Pages site, and Pages has a single deployment
# slot. pr-previews.yml already builds the default branch into the site root
# (include_root) AND every per-PR preview into /<label>/ plus the /previews/
# hub. When this workflow also ran on push to main it replaced the whole site
# with a root-only build, silently deleting /previews/, /pr-25/, /pr-27/,
# /pr-28/, /pr-29/ and /integrated/.
#
# That is exactly how the preview hub 404'd on 2026-10-07: a fork-main push
# triggered this workflow (run 37538150030) right after a successful
# pr-previews deploy (run 37437148947). Keep this workflow manual-only.
on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci
        working-directory: web
      - name: Build web app
        run: npm run build
        working-directory: web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
