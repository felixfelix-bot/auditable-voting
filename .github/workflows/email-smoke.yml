# Email dependency smoke — cashu.email real-send verification + offline logic tests
#
# Q1/Q3: prove the cashu.email email dependency works, WITHOUT burning 100 sats
# or tripping Cloudflare on every PR commit.
#
# Design (respects rate-limit + cost constraints):
#   - offline-test: deterministic stub-based send-logic regression net. 0 cost,
#     0 network, no Cloudflare exposure. Runs on EVERY PR/commit.
#   - live-send: ONE real cashu.email send, only on a schedule (~daily) and on
#     merge to main — not per PR commit. Bounded spend + no Cloudflare hammering.
#     This is the "one test per CI run to confirm the dependency actually works"
#     that catches "it's not working" complaints.
#
# Secrets required (repo secrets):
#   NOMAIN_NSEC              — sender Nostr key owning an address@cashu.email
#   TESTNUT_MINT_CASHU_TOKEN — V4 cashuB token from a testnut mint (auto-pay).
#       Mint with Nutshell v0.20+ (V4 / cashuB prefix REQUIRED — cashu-ts-encoded
#       V4 is rejected by cashu.email with 402):
#         cashu -h https://nofee.testnut.cashu.space -w <w> invoice 100
#         cashu -h https://nofee.testnut.cashu.space -w <w> send 100
#   TEST_RECIPIENT           — controlled inbox that can receive the smoke email.

name: Email Smoke (cashu.email)

on:
  pull_request:
  push:
    branches: ["main"]
  schedule:
    - cron: "37 4 * * *"   # daily 04:37 UTC — 1 send/day max from live-send
  workflow_dispatch:        # manual on-demand probe (e.g. before onboarding)

concurrency:
  group: email-smoke
  cancel-in-progress: false   # never cancel a smoke that's already spending postage

jobs:
  offline-test:
    name: Email send logic (offline, deterministic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies (for nostr-tools)
        run: npm ci
        working-directory: web

      # Always-on regression net: stubs the nomail/cashu.email HTTP layer.
      # Runs on EVERY PR/commit. Q3: cashu.email send-logic coverage in CI.
      - name: Run offline email send tests
        working-directory: .
        run: node --test scripts/test/otp-send-email.test.mjs

  live-send:
    name: Real cashu.email send
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'schedule') ||
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies (for nostr-tools)
        run: npm ci
        working-directory: web

      # Exactly ONE real send. No retry loop. 200 {ok:true} or the job fails
      # loudly (the "dependency is broken" signal the operator wants).
      - name: Run coordinator live email smoke (exactly one send)
        env:
          NOMAIN_NSEC: ${{ secrets.NOMAIN_NSEC }}
          TESTNUT_CASHU_TOKEN: ${{ secrets.TESTNUT_MINT_CASHU_TOKEN }}
          TEST_RECIPIENT: ${{ secrets.TEST_RECIPIENT }}
          LIVE_ALLOW: "1"
        run: |
          node --test scripts/test/live-otp-send-email.test.mjs
